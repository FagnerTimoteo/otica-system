$kind: http-request
name: Buscar Pagamento por ID
method: GET
url: '{{baseUrl}}/pagamentos/{{pagamentoId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
        pm.response.to.be.json;
      });

      pm.test("Response has id", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json.id).to.be.a("number");
      });

      pm.test("Response has tipo", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("tipo");
        pm.expect(json.tipo).to.be.a("string");
      });

      pm.test("Response has valor", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("valor");
      });

      pm.test("Response has status", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("status");
      });

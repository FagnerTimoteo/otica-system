$kind: http-request
name: Criar Fornecedor
method: POST
url: '{{baseUrl}}/fornecedores'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Ótica Distribuidora Ltda",
      "telefone": "(11) 3333-4444",
      "email": "contato@distribuidora.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
        pm.response.to.be.json;
      });

      pm.test("Response has id", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json.id).to.be.a("number");
      });

      pm.test("Response has nome", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("nome");
        pm.expect(json.nome).to.be.a("string");
      });

      const json = pm.response.json();
      if (json && json.id) {
        pm.collectionVariables.set("fornecedorId", json.id);
      }

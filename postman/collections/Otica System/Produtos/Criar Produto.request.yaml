$kind: http-request
name: Criar Produto
method: POST
url: '{{baseUrl}}/produtos'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Armação Ray-Ban",
      "preco": 299.90,
      "quantidadeEstoque": 10,
      "tipo": "ARMACAO"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
        pm.response.to.be.json;
      });

      pm.test("Response has id", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json.id).to.be.a("number");
      });

      pm.test("Response has nome", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("nome");
        pm.expect(json.nome).to.be.a("string");
      });

      pm.test("Response has preco", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("preco");
      });

      pm.test("Response has quantidadeEstoque", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("quantidadeEstoque");
        pm.expect(json.quantidadeEstoque).to.be.a("number");
      });

      const json = pm.response.json();
      if (json && json.id) {
        pm.collectionVariables.set("produtoId", json.id);
      }

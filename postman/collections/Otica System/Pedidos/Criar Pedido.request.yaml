$kind: http-request
name: Criar Pedido
method: POST
url: "{{baseUrl}}/pedidos"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dataPedido": "2024-01-15T10:00:00",
      "status": "AGUARDANDO_PAGAMENTO",
      "preco": 599.90
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
        pm.response.to.be.json;
      });

      pm.test("Response has id", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json.id).to.be.a("number");
      });

      pm.test("Response has status", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("status");
        pm.expect(json.status).to.be.a("string");
      });

      pm.test("Response has preco", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("preco");
      });

      const json = pm.response.json();
      if (json && json.id) {
        pm.collectionVariables.set("pedidoId", json.id);
      }
    language: text/javascript
